          import os, re, glob, shutil
          manter = {"index.html", "capa.png", "whatsapp.txt", "edicao.json", "fapesq.png", "marca-secties.png",
                    "secretario.jpg", "CNAME", ".nojekyll", ".gitignore", "README.md"}
          os.makedirs("edicoes", exist_ok=True); os.makedirs("doe", exist_ok=True)
          for f in glob.glob("????-??-??*.json"):
              if re.fullmatch(r"\d{4}-\d{2}-\d{2}\.json", f) and not os.path.exists("edicoes/" + f):
                  os.replace(f, "edicoes/" + f)
          for f in glob.glob("????-??-??.txt"):
              os.replace(f, "doe/" + f)
          if not os.path.isfile("secretario.jpg") and os.path.isfile("ferramentas/secretario.jpg"):
              shutil.copy("ferramentas/secretario.jpg", "secretario.jpg")
          if not os.path.isfile("marca-secties.png") and os.path.isfile("ferramentas/marca-secties.png"):
              shutil.copy("ferramentas/marca-secties.png", "marca-secties.png")
          removidos = 0
          for f in os.listdir("."):
              if os.path.isfile(f) and f not in manter and not re.fullmatch(r"capa-\d{4}-\d{2}-\d{2}-\d{4}\.png", f):
                  os.remove(f); removidos += 1
          for d in ("radar", "fontes", "ferramentas", "exemplos", "site"):
              if os.path.isdir(d):
                  shutil.rmtree(d); removidos += 1
          open(".nojekyll", "a").close()
          open(".gitignore", "w").write("__pycache__/\n*.pyc\n.DS_Store\n")
          open("README.md", "w").write(
              "# Radar SECTIES\n\nClipping diário de ciência, tecnologia, inovação e ensino superior da SECTIES-PB e da FAPESQ.\n\n"
              "Site: https://radarsecties.github.io\n\n"
              "Este repositório guarda só o site publicado (`index.html`, `capa.png`, `whatsapp.txt`) e o histórico "
              "(`edicoes/`, `data/`, `doe/`). Todo o resto do Radar está dentro da rotina `.github/workflows/doe.yml`, "
              "que roda sozinha às 7h05 e às 8h20. Para atualizar o Radar, troque o conteúdo desse arquivo.\n")
          print("Itens soltos removidos:", removidos)
          PY

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ferramentas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils fonts-liberation
          pip install -q feedparser requests beautifulsoup4 pillow

      - name: Baixar o Diário Oficial pelo servidor do governo
        continue-on-error: true
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p "$RUNNER_TEMP/doe-pdfs"
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_KEY" ]; then echo "Servidor não configurado; o Diário será lido direto."; exit 0; fi
          mkdir -p ~/.ssh && printf '%s\n' "$SSH_KEY" > ~/.ssh/radar && chmod 600 ~/.ssh/radar
          DIA=$(TZ=America/Fortaleza date +%F)
          if timeout 300 ssh -i ~/.ssh/radar -p "${SSH_PORT:-22}" -o StrictHostKeyChecking=no -o ConnectTimeout=20 "$SSH_USER@$SSH_HOST" "python3 - $DIA" < "$RUNNER_TEMP/radar/radar/doe_proxy.py" > "$RUNNER_TEMP/doe.tgz"; then
            tar xzf "$RUNNER_TEMP/doe.tgz" -C "$RUNNER_TEMP/doe-pdfs" && ls -la "$RUNNER_TEMP/doe-pdfs"
          else
            echo "O servidor não conseguiu baixar o Diário; a rotina tenta direto."
            rm -rf "$RUNNER_TEMP/doe-pdfs"/*
          fi
          rm -f ~/.ssh/radar

      - name: Ler os portais, o Diário Oficial e montar o site
        env:
          RADAR_RAIZ: ${{ github.workspace }}
          RADAR_ENDERECO: https://radar.secties.pb.gov.br/
          RADAR_DOE_PDFS: ${{ runner.temp }}/doe-pdfs
          RADAR_CHAVE_EDITORIAL: ${{ secrets.RADAR_CHAVE_EDITORIAL }}
          TZ: America/Fortaleza
        working-directory: ${{ runner.temp }}/radar
        run: python3 -m radar.main

      - name: Publicar no repositório
        run: |
          git config user.name "radar-secties"
          git config user.email "radar@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nada novo para publicar."
            exit 0
          fi
          git commit -q -m "Radar SECTIES: edição de $(TZ=America/Fortaleza date +%d/%m/%Y)"
          for tentativa in 1 2 3; do
            git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && exit 0
            sleep 15
          done
          echo "Não foi possível publicar depois de 3 tentativas." && exit 1
      
      - name: Publish to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY}}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /var/www/radarsecties
            git pull origin main

# Radar SECTIES: tarefa agendada diária. O Radar inteiro está neste arquivo.
# 7h05: lê todos os portais e publica a edição do dia.
# 8h20: segunda passagem, para incluir o Diário Oficial.
# Também roda quando este arquivo é salvo, e pode ser disparada em Actions > Radar SECTIES > Run workflow.
# Para atualizar o Radar no futuro, basta trocar o conteúdo deste arquivo.
name: Radar SECTIES

on:
  schedule:
    - cron: "5 10 * * *"
    - cron: "20 11 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  edicao:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4


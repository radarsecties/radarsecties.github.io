# Radar SECTIES: tarefa agendada diária, tudo no GitHub.
# 7h05: lê todos os portais e publica a edição do dia.
# 8h20: segunda passagem, para incluir o Diário Oficial (que sai entre 7h e 8h).
# Também roda sempre que algo é enviado ao repositório, e pode ser disparada à mão.
name: Radar SECTIES

on:
  schedule:
    - cron: "5 10 * * *"
    - cron: "20 11 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  edicao:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Arrumar arquivos enviados soltos na raiz
        run: |
          python3 - <<'PY'
          import os, re, glob, shutil
          def por(src, dst):
              if os.path.isfile(src):
                  os.makedirs(os.path.dirname(dst), exist_ok=True)
                  os.replace(src, dst)
          for f in ["__init__.py", "classificar.py", "coletar.py", "doe.py", "editorial.py", "main.py", "montar.py", "modelo.html"]:
              por(f, "radar/" + f)
          por("fontes.json", "fontes/fontes.json")
          por("curiosidades.json", "ferramentas/curiosidades.json")
          por("edicao-exemplo.json", "exemplos/edicao-exemplo.json")
          for f in ["Arimo-400.ttf", "Arimo-700.ttf", "LICENSE-Arimo.txt"]:
              por(f, "ferramentas/fontes/" + f)
          for f in glob.glob("????-??-??.json"):
              por(f, "edicoes/" + f)
          for f in glob.glob("????-??-??.txt"):
              por(f, "doe/" + f)
          if os.path.isfile("secretario.jpg") and not os.path.isfile("ferramentas/secretario.jpg"):
              os.makedirs("ferramentas", exist_ok=True); shutil.copy("secretario.jpg", "ferramentas/secretario.jpg")
          lixo = [f for f in os.listdir(".") if os.path.isfile(f) and (f.startswith("download") or re.search(r" \(\d+\)\.(png|jpe?g)$", f) or f.startswith("radar-upload-") or f == "radar.yml")]
          lixo += [f for f in ("ferramentas/modelo.html", "ferramentas/montar.py") if os.path.isfile(f)]
          for f in lixo:
              os.remove(f)
          if not os.path.isfile(".gitignore"):
              open(".gitignore", "w").write("__pycache__/\n*.pyc\n.DS_Store\n")
          print("Arrumados/removidos:", len(lixo), "arquivos soltos")
          PY

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ferramentas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils fonts-liberation
          pip install -q -r requirements.txt

      - name: Ler os portais, o Diário Oficial e montar o site
        env:
          RADAR_CHAVE_EDITORIAL: ${{ secrets.RADAR_CHAVE_EDITORIAL }}
          TZ: America/Fortaleza
        run: python3 -m radar.main

      - name: Publicar no repositório
        run: |
          git config user.name "radar-secties"
          git config user.email "radar@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nada novo para publicar."
            exit 0
          fi
          git commit -q -m "Radar SECTIES: edição de $(TZ=America/Fortaleza date +%d/%m/%Y)"
          for tentativa in 1 2 3; do
            git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && exit 0
            sleep 15
          done
          echo "Não foi possível publicar depois de 3 tentativas." && exit 1

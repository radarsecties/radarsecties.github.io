name: Baixar Diario Oficial PB

# Tenta a cada 10 minutos entre 7h00 e 8h50 (horario de Fortaleza = UTC-3)
# e para assim que a edicao do dia estiver salva em doe/AAAA-MM-DD.txt
on:
  schedule:
    - cron: "*/10 10-11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: doe
  cancel-in-progress: false

jobs:
  baixar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baixar e converter a edicao do dia
        run: |
          set -u
          export TZ=America/Fortaleza
          HOJE=$(date +%F); DIA=$(date +%d); MESN=$(date +%m); ANO=$(date +%Y)
          MESES=(janeiro fevereiro marco abril maio junho julho agosto setembro outubro novembro dezembro)
          MES=${MESES[$((10#$MESN-1))]}
          ALVO="doe/$HOJE.txt"
          if [ -s "$ALVO" ]; then echo "Ja existe $ALVO"; exit 0; fi
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y poppler-utils >/dev/null
          mkdir -p doe tmp
          BASE="https://auniao.pb.gov.br/servicos/doe/$ANO/$MES"
          # lista todos os PDFs da data (edicao normal e suplementos)
          curl -sSL --retry 3 "$BASE" -o tmp/lista.html || true
          grep -oE "href=\"[^\"]*$DIA-$MESN-$ANO[^\"]*\.pdf" tmp/lista.html | sed 's/href="//' | sort -u > tmp/links.txt || true
          if [ ! -s tmp/links.txt ]; then
            echo "$BASE/diario-oficial-$DIA-$MESN-$ANO-portal.pdf" > tmp/links.txt
          fi
          : > tmp/saida.txt; ok=0
          while read -r L; do
            case "$L" in http*) U="$L";; /*) U="https://auniao.pb.gov.br$L";; *) U="$BASE/$L";; esac
            N=$(basename "$U")
            curl -sSL --retry 3 "$U/@@download/file" -o "tmp/$N" || continue
            if head -c 4 "tmp/$N" | grep -q '%PDF'; then
              { echo "===== ARQUIVO: $N"; echo "===== URL: ${U}/view"; pdftotext -layout "tmp/$N" -; } >> tmp/saida.txt
              ok=1
            fi
          done < tmp/links.txt
          if [ "$ok" = 1 ]; then
            mv tmp/saida.txt "$ALVO"; echo "Salvo $ALVO ($(wc -c < "$ALVO") bytes)"
          else
            echo "Edicao de $HOJE ainda nao publicada"
          fi
          rm -rf tmp

      - name: Gravar no repositorio
        run: |
          git config user.name "radar-doe"
          git config user.email "radar-doe@users.noreply.github.com"
          git add doe/ || true
          if git diff --cached --quiet; then echo "Nada novo"; exit 0; fi
          git commit -m "Diario Oficial PB: texto de $(TZ=America/Fortaleza date +%d/%m/%Y)"
          git pull --rebase origin main && git push origin HEAD:main

# Radar SECTIES: rotina diária automática, tudo no GitHub.
# Roda às 7h40 e às 8h40 (horário de Fortaleza) e sempre que arquivos novos são enviados.
# O GitHub Pages publica o site sozinho a cada gravação.
name: Radar SECTIES

on:
  schedule:
    - cron: "40 10 * * *"
    - cron: "40 11 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  edicao:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar ferramentas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils fonts-liberation
          pip install -r requirements.txt

      - name: Coletar notícias, ler o Diário Oficial e montar o site
        env:
          RADAR_CHAVE_EDITORIAL: ${{ secrets.RADAR_CHAVE_EDITORIAL }}
          TZ: America/Fortaleza
        run: python3 -m radar.main

      - name: Publicar
        run: |
          git config user.name "radar-secties"
          git config user.email "radar@users.noreply.github.com"
          git add -A edicoes data doe index.html capa.png whatsapp.txt edicao.json fapesq.png marca-secties.png secretario.jpg
          if git diff --cached --quiet; then
            echo "Nada novo para publicar."
          else
            git commit -m "Radar SECTIES: edição de $(TZ=America/Fortaleza date +%d/%m/%Y)"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi

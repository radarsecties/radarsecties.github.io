<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CIQUANTA CRM</title>
<meta name="description" content="Sistema de relações institucionais do CIQUANTA, Centro Internacional de Computação e Tecnologias Quânticas do Estado da Paraíba.">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://brasilapi.com.br https://publica.cnpj.ws https://minhareceita.org; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icone-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F7F7F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1120" media="(prefers-color-scheme: dark)">
<link rel="preload" href="assets/fonts/libre-franklin-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/deck.css">
<script src="js/tema.js"></script>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#/painel" aria-label="CIQUANTA, início">
      <img class="claro" src="assets/logo-marinho.png" alt="CIQUANTA" width="118" height="12"><img class="escuro" src="assets/logo-branco.png" alt="" width="118" height="12" aria-hidden="true"><span class="crm">CRM</span>
    </a>
    <nav class="nav" id="nav" aria-label="Navegação principal"></nav>
    <div class="sidebar-foot">
      <button id="gmail-status" class="gstatus off" type="button"><span class="dot"></span><span class="txt">E-mail desconectado</span></button>
      <div class="pe"><a href="#/automacao" data-route="automacao" id="pe-auto">Automação</a><a href="#/config" data-route="config" id="pe-config">Configurações</a><a href="#/sair" id="pe-sair" class="hidden">Sair</a></div>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menu-btn" aria-label="Abrir menu"></button>
      <h1 id="page-title">Hoje</h1>
      <div class="topbar-actions">
        <button class="busca-btn" id="global-search" type="button" aria-label="Busca rápida"><i id="busca-ic"></i><span>Buscar ou executar</span><kbd>Ctrl K</kbd></button>
        <button class="icon-btn hidden" id="sync-btn" aria-label="Base compartilhada"></button>
        <button class="icon-btn" id="live-btn" title="Caixa de entrada" aria-label="Caixa de entrada"></button>
        <button class="icon-btn" id="theme-btn" title="Tema claro ou escuro" aria-label="Alternar tema"></button>
      </div>
    </header>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
</div>
<div id="modal-root"></div>
<div id="toasts" aria-live="polite"></div>
<script src="js/vendor/chart.umd.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CIQUANTA · Relações Institucionais</title>
<meta name="description" content="Sistema de relações institucionais do CIQUANTA, Centro Internacional de Computação e Tecnologias Quânticas do Estado da Paraíba.">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/deck.css">
<script>
  try { const t = localStorage.getItem('ciquanta:tema'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#/painel" aria-label="CIQUANTA, início">
      <img class="l-light" src="assets/logo-azul.png" alt="CIQUANTA" width="196" height="20"><img class="l-dark" src="assets/logo-branco.png" alt="CIQUANTA" width="196" height="20">
      <span>Relações Institucionais</span>
    </a>
    <nav class="nav" id="nav" aria-label="Navegação principal"></nav>
    <div class="sidebar-foot">
      <button id="gmail-status" class="gstatus off" type="button"><span class="dot"></span><span class="txt">Google desconectado</span></button>
      <img src="assets/secties-govpb.png" alt="Secretaria de Estado da Ciência, Tecnologia, Inovação e Ensino Superior, Governo da Paraíba" class="parceiros">
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menu-btn" aria-label="Abrir menu"></button>
      <h1 id="page-title">Painel</h1>
      <div class="topbar-actions">
        <input type="search" id="global-search" placeholder="Buscar organização, contato ou oportunidade" aria-label="Busca">
        <button class="icon-btn" id="live-btn" title="Interações em tempo real" aria-label="Interações em tempo real"></button>
        <button class="icon-btn" id="theme-btn" title="Alternar tema claro e escuro" aria-label="Alternar tema"></button>
      </div>
    </header>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
</div>
<div id="modal-root"></div>
<div id="toasts" aria-live="polite"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CIQUANTA · Apresentação</title>
<meta name="description" content="Apresentação do CIQUANTA, Centro Internacional de Computação Quântica do Estado da Paraíba.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/deck.css">
<style>
  body { background: #010209; color: #EEF1FA; }
  .pub { max-width: 1180px; margin: 0 auto; padding: 22px 18px 40px; }
  .pub header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
  .pub header img { width: 200px; height: auto; }
  .pub h1 { font-size: 17px; font-weight: 600; color: #C8CFEA; margin: 0; }
  .pub .deck-bar .btn { background: #0E1736; color: #EEF1FA; border-color: #2C3D78; }
  .pub .deck-bar .pg { color: #C8CFEA; }
  .pub footer { margin-top: 22px; color: #8790B5; font-size: 13px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .pub footer a { color: #A9B8EE; }
</style>
</head>
<body>
<div class="pub">
  <header><img src="assets/logo-branco.png" alt="CIQUANTA"><h1 id="titulo">Carregando…</h1></header>
  <div id="viewer"></div>
  <footer><span id="fonte"></span><span>Contato: <a href="mailto:ciquanta@secties.pb.gov.br">ciquanta@secties.pb.gov.br</a></span></footer>
</div>
<script type="module">
  import { buildDeck, mountViewer } from './js/deck.js';
  const p = new URLSearchParams(location.search);
  const id = p.get('d') || 'institucional';
  try {
    const deck = await buildDeck(id);
    document.title = deck.titulo;
    document.getElementById('titulo').textContent = deck.titulo;
    document.getElementById('fonte').textContent = 'Fonte: ' + deck.fonte;
    mountViewer(document.getElementById('viewer'), deck, { start: Math.max(0, (+p.get('s') || 1) - 1) });
  } catch (err) {
    document.getElementById('titulo').textContent = 'Apresentação não encontrada';
  }
</script>
</body>
</html>
